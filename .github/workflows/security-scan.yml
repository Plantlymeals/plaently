name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit (block on critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit (fail on critical)
        run: |
          set -o pipefail
          # npm audit works against the bun-generated lockfile via package.json
          npx --yes better-npm-audit audit --level critical || {
            echo "::error::Critical vulnerabilities detected in dependencies."
            exit 1
          }

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --no-banner --redact --exit-code 1

  static-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Fail the job if any new error-severity alerts are introduced
          upload: always

  supabase-sql-lint:
    name: Supabase SQL Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for risky SQL patterns in migrations
        run: |
          set -e
          shopt -s nullglob
          FOUND=0
          for f in supabase/migrations/*.sql; do
            # Flag CREATE TABLE in public schema without subsequent ENABLE ROW LEVEL SECURITY
            if grep -Eiq 'create\s+table\s+(public\.)?[a-z_]+' "$f"; then
              if ! grep -Eiq 'enable\s+row\s+level\s+security' "$f"; then
                echo "::error file=$f::CREATE TABLE without ENABLE ROW LEVEL SECURITY"
                FOUND=1
              fi
            fi
            # Flag overly permissive policies
            if grep -Eiq "(using|with\s+check)\s*\(\s*true\s*\)" "$f"; then
              if grep -Eiq 'for\s+(insert|update|delete|all)' "$f"; then
                echo "::warning file=$f::Permissive RLS policy detected (USING/CHECK true on mutating policy)"
              fi
            fi
          done
          exit $FOUND

  required-checks:
    name: Security Gate
    needs: [dependency-audit, secret-scan, static-analysis, supabase-sql-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all security jobs passed
        run: |
          if [ "${{ needs.dependency-audit.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.static-analysis.result }}" != "success" ] || \
             [ "${{ needs.supabase-sql-lint.result }}" != "success" ]; then
            echo "::error::One or more security checks failed. Merge blocked."
            exit 1
          fi
          echo "All security checks passed."